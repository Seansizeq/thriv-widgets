<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year Progress</title>
<style>
  :root {
    --bg: #191919;
    --card: #202020;
    --border: #2e2e2e;
    --text: #e6e6e6;
    --muted: #8a8a8a;
    --accent: #3dbd9a;
    --track: #3a3a3a;
    --yellow: #f2d71c;
  }
  body.light {
    --bg: #ffffff; --card: #f7f7f5; --border: #e6e6e3; --text: #2f2f2f;
    --muted: #8b8b88; --track: #e1e1de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); height: 100%; }
  body {
    font-family: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 6px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 18px;
    position: relative;
    height: 300px;
    display: flex;
    flex-direction: column;
  }
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .rows > .row { margin-top: 0; }
  .title { font-size: 12.5px; font-weight: 500; color: var(--text); opacity: .85; }
  .big { font-size: 26px; font-weight: 700; color: var(--accent); margin-top: 6px; letter-spacing: -.5px; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .ring { position: absolute; top: 14px; right: 16px; width: 34px; height: 34px; }
  .ring circle { fill: none; stroke-width: 3.5; }
  .ring .bg { stroke: var(--track); opacity: .55; }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s; }
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0 12px; }
  .row { margin-top: 12px; }
  .row:first-of-type { margin-top: 0; }
  .label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }
  .label b { color: var(--text); font-weight: 600; }
  .segs { display: flex; gap: 5px; }
  .seg { flex: 1; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .seg > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; width: 0; transition: width .6s; }
  .days { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 600; color: var(--muted); padding: 0 2px; }
  .days span { width: 34px; text-align: center; padding: 2px 0; border-radius: 4px; }
  .days span.today { background: var(--yellow); color: #1a1a1a; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; width: 0; transition: width .6s; }
</style>
</head>
<body>
  <div class="card">
    <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle class="bg" cx="18" cy="18" r="15"></circle>
      <circle class="fg" id="ring" cx="18" cy="18" r="15"></circle>
    </svg>
    <div class="title">Year Progress</div>
    <div class="big" id="yearPct">–%</div>
    <div class="sub" id="yearDay">Day – of –</div>
    <hr>
    <div class="rows">
    <div class="row">
      <div class="label"><span>Month</span><b id="monthPct">–%</b></div>
      <div class="segs" id="monthSegs"></div>
    </div>
    <div class="row">
      <div class="label"><span>Week</span><b id="weekPct">–%</b></div>
      <div class="days" id="days"></div>
    </div>
    <div class="row">
      <div class="label"><span>Day</span><b id="dayPct">–%</b></div>
      <div class="bar"><i id="dayBar"></i></div>
    </div>
    </div>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    if (params.get('theme') === 'light') document.body.classList.add('light');

    var R = 15, C = 2 * Math.PI * R;
    var ring = document.getElementById('ring');
    ring.style.strokeDasharray = C;

    // Month: 4 segments
    var segWrap = document.getElementById('monthSegs');
    for (var i = 0; i < 4; i++) {
      var s = document.createElement('div'); s.className = 'seg';
      s.appendChild(document.createElement('i')); segWrap.appendChild(s);
    }
    // Week: M..S
    var daysWrap = document.getElementById('days');
    'MTWTFSS'.split('').forEach(function (l) {
      var sp = document.createElement('span'); sp.textContent = l; daysWrap.appendChild(sp);
    });

    function pct(x) { return Math.min(100, Math.max(0, Math.round(x * 100))); }

    function update() {
      var now = new Date();
      var y = now.getFullYear();
      var startY = new Date(y, 0, 1), endY = new Date(y + 1, 0, 1);
      var daysInYear = Math.round((endY - startY) / 864e5);
      var dayOfYear = Math.floor((new Date(y, now.getMonth(), now.getDate()) - startY) / 864e5) + 1;
      var yearFrac = (now - startY) / (endY - startY);

      var startM = new Date(y, now.getMonth(), 1), endM = new Date(y, now.getMonth() + 1, 1);
      var monthFrac = (now - startM) / (endM - startM);

      var dow = (now.getDay() + 6) % 7; // Monday = 0
      var startD = new Date(y, now.getMonth(), now.getDate());
      var dayFrac = (now - startD) / 864e5;
      var weekFrac = (dow + dayFrac) / 7;

      document.getElementById('yearPct').textContent = pct(yearFrac) + '%';
      document.getElementById('yearDay').textContent = 'Day ' + dayOfYear + ' of ' + daysInYear;
      ring.style.strokeDashoffset = C * (1 - yearFrac);

      document.getElementById('monthPct').textContent = pct(monthFrac) + '%';
      var segs = segWrap.querySelectorAll('.seg > i');
      for (var k = 0; k < 4; k++) {
        var f = Math.min(1, Math.max(0, monthFrac * 4 - k));
        segs[k].style.width = (f * 100) + '%';
      }

      document.getElementById('weekPct').textContent = pct(weekFrac) + '%';
      var spans = daysWrap.querySelectorAll('span');
      for (var d = 0; d < 7; d++) spans[d].classList.toggle('today', d === dow);

      document.getElementById('dayPct').textContent = pct(dayFrac) + '%';
      document.getElementById('dayBar').style.width = (dayFrac * 100) + '%';
    }
    update();
    setInterval(update, 30000);
  })();
</script>
</body>
</html>
