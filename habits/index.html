<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
  :root {
    --bg: #191919; --card: #202020; --border: #2e2e2e; --text: #e6e6e6;
    --muted: #8a8a8a; --empty: #2c2c2c; --tab: #2a2a2a;
  }
  body.light { --bg:#fff; --card:#f7f7f5; --border:#e6e6e3; --text:#2f2f2f; --muted:#8b8b88; --empty:#e9e9e6; --tab:#ececea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); padding: 6px; -webkit-font-smoothing: antialiased; user-select: none; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .tab.on { background: var(--tab); color: var(--text); font-weight: 500; }
  .tab svg { width: 13px; height: 13px; fill: currentColor; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .hm { justify-content: start; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 10px 8px; display: flex; flex-direction: column; }
  .name { font-size: 12px; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm { display: grid; gap: 3px; align-items: center; }
  .lbl { font-size: 7.5px; font-weight: 600; border-radius: 2px; padding: 1px 2px; text-align: center; color: var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); line-height: 1.25; }
  .hd { height: var(--cs); width: var(--cs); border-radius: 2px; background: color-mix(in srgb, var(--c) 28%, transparent); }
  .cell { height: var(--cs); width: var(--cs); border-radius: 3px; position: relative; cursor: pointer; }
  .cell.past { background: transparent; }
  .cell.past::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: var(--c); opacity: .9; }
  .cell.future { background: color-mix(in srgb, var(--c) 18%, transparent); cursor: default; }
  .cell.done { background: var(--c); }
  .cell.done::after { display: none; }
  .cell.today { outline: 1.5px solid var(--c); outline-offset: 1px; }
  .cell.none { visibility: hidden; }
  .cell:not(.future):not(.none):hover { filter: brightness(1.25); }
  .foot { margin-top: 8px; }
  .mark { font: inherit; font-size: 11.5px; color: var(--muted); background: transparent; border: none; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
  .mark:hover { background: var(--tab); color: var(--text); }
  .mark.ok { color: var(--c); font-weight: 600; }
  .bar { display: flex; justify-content: flex-start; align-items: center; gap: 4px; margin-bottom: 10px; padding-right: 90px; }
  .bar .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  .bar .tabs { margin-bottom: 0; }
  .edit { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .edit:hover { background: var(--tab); color: var(--text); }
  .editor { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; max-width: 460px; }
  .editor h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
  .er { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .er i { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .er input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; outline: none; }
  .er input:focus { border-color: #3dbd9a; }
  .ib { font: inherit; font-size: 12px; width: 24px; height: 24px; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 5px; cursor: pointer; }
  .ib:hover { color: var(--text); border-color: var(--muted); }
  .ib:disabled { opacity: .3; cursor: default; }
  .eb { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .btn { font: inherit; font-size: 12px; font-weight: 600; color: var(--text); background: var(--tab); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .btn.pri { border-color: #3dbd9a; color: #3dbd9a; }
  .hint { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .eb .btn { white-space: nowrap; }
</style>
</head>
<body>
  <div class="bar">
  <div class="tabs">
    <button class="tab" data-v="month"><svg viewBox="0 0 16 16"><path d="M4 1h1.5v1.5h5V1H12v1.5h1.5A1.5 1.5 0 0 1 15 4v9.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5V4a1.5 1.5 0 0 1 1.5-1.5H4zm-1.5 5v7h11v-7z"/></svg>This Month</button>
    <button class="tab" data-v="quarter"><svg viewBox="0 0 16 16"><path d="M4 1h1.5v1.5h5V1H12v1.5h1.5A1.5 1.5 0 0 1 15 4v9.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5V4a1.5 1.5 0 0 1 1.5-1.5H4zm-1.5 5v7h11v-7z"/></svg>This Quarter</button>
  </div>
  <span class="sep"></span>
  <button class="edit" id="editBtn">✎ Edit habits</button>
  </div>
  <div class="grid" id="grid"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.body.classList.add('light');
  var KEY = 'thriv-habits-v1';
  var COLORS = ['#9b6dd6', '#e0883a', '#b7703f', '#d9455f', '#3d8fd9', '#d94f9b', '#3dbd9a', '#d9b43d'];
  var DEFAULT = ['Mind Archive Entry', 'Morning Focus', 'Physical Reset', 'Financial Snapshot', 'Learn Something New', 'Creative Challenge'];
  var urlNames = (params.get('habits') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var names;
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  var data = load();
  data.habits = data.habits || {};
  if (data.custom && Array.isArray(data.names) && data.names.length) names = data.names;
  else names = urlNames.length ? urlNames : DEFAULT;
  names = names.slice(0, 8);
  data.names = names;
  names.forEach(function (n) { data.habits[n] = data.habits[n] || {}; });
  save(data);

  var view = 'month';
  try { view = localStorage.getItem(KEY + '-view') || 'month'; } catch (e) {}

  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }

  function range() {
    var now = new Date(), start, end;
    if (view === 'quarter') {
      var q = Math.floor(now.getMonth() / 3) * 3;
      start = new Date(now.getFullYear(), q, 1); end = new Date(now.getFullYear(), q + 3, 0);
    } else {
      start = new Date(now.getFullYear(), now.getMonth(), 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    }
    var gridStart = addDays(start, -start.getDay());
    var cols = Math.ceil((((end - gridStart) / 864e5) + 1) / 7);
    return { start: start, end: end, gridStart: gridStart, cols: cols };
  }

  function render() {
    if (editing) return;
    data = load(); data.habits = data.habits || {};
    if (data.custom && Array.isArray(data.names) && data.names.length) names = data.names;
    var r = range(), today = iso(new Date());
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.v === view); });
    var grid = document.getElementById('grid'); grid.innerHTML = '';
    names.forEach(function (name, i) {
      var c = COLORS[i % COLORS.length], h = data.habits[name] || {};
      var card = document.createElement('div'); card.className = 'card'; card.style.setProperty('--c', c);
      var t = document.createElement('div'); t.className = 'name'; t.textContent = name; card.appendChild(t);
      var hm = document.createElement('div'); hm.className = 'hm';
      var cs = view === 'quarter' ? 8 : 14; hm.style.setProperty('--cs', cs + 'px');
      hm.style.gridTemplateColumns = (view === 'quarter' ? '20px' : '24px') + ' repeat(' + r.cols + ', ' + cs + 'px)';
      hm.style.gap = (view === 'quarter' ? '2px' : '3px');
      hm.appendChild(document.createElement('div'));
      for (var w = 0; w < r.cols; w++) { var hd = document.createElement('div'); hd.className = 'hd'; hm.appendChild(hd); }
      for (var d = 0; d < 7; d++) {
        var l = document.createElement('div'); l.className = 'lbl'; l.textContent = DAYS[d]; hm.appendChild(l);
        for (var w2 = 0; w2 < r.cols; w2++) {
          var date = addDays(r.gridStart, w2 * 7 + d), key = iso(date);
          var cell = document.createElement('div'); cell.className = 'cell';
          if (date < r.start || date > r.end) cell.classList.add('none');
          else if (key > today) cell.classList.add('future');
          else { cell.classList.add('past'); if (h[key]) cell.classList.add('done'); if (key === today) cell.classList.add('today'); cell.dataset.k = key; cell.dataset.h = name; cell.title = key; }
          hm.appendChild(cell);
        }
      }
      card.appendChild(hm);
      var f = document.createElement('div'); f.className = 'foot';
      var b = document.createElement('button'); b.className = 'mark'; b.dataset.h = name;
      b.textContent = h[today] ? 'Done today ✓' : 'Mark Done'; if (h[today]) b.classList.add('ok');
      f.appendChild(b); card.appendChild(f);
      grid.appendChild(card);
    });
  }

  function toggle(name, key) {
    data = load(); data.habits = data.habits || {}; data.habits[name] = data.habits[name] || {};
    if (data.habits[name][key]) delete data.habits[name][key]; else data.habits[name][key] = true;
    data.names = names; save(data); render();
  }

  var editing = null; // [{orig, name}]
  function openEditor() {
    editing = names.map(function (n) { return { orig: n, name: n }; });
    drawEditor();
  }
  function drawEditor() {
    document.querySelector('.tabs').style.visibility = 'hidden';
    document.getElementById('editBtn').style.display = 'none';
    var g = document.getElementById('grid'); g.innerHTML = '';
    var ed = document.createElement('div'); ed.className = 'editor';
    ed.innerHTML = '<h4>Edit habits</h4>';
    editing.forEach(function (row, i) {
      var r = document.createElement('div'); r.className = 'er';
      r.innerHTML = '<i style="background:' + COLORS[i % COLORS.length] + '"></i>';
      var inp = document.createElement('input'); inp.value = row.name; inp.maxLength = 40; inp.placeholder = 'Habit name';
      inp.oninput = function () { row.name = inp.value; };
      r.appendChild(inp);
      [['↑', -1], ['↓', 1]].forEach(function (a) {
        var b = document.createElement('button'); b.className = 'ib'; b.textContent = a[0]; b.title = a[1] < 0 ? 'Move up' : 'Move down';
        b.disabled = (a[1] < 0 && i === 0) || (a[1] > 0 && i === editing.length - 1);
        b.onclick = function () { var j = i + a[1]; var t = editing[i]; editing[i] = editing[j]; editing[j] = t; drawEditor(); };
        r.appendChild(b);
      });
      var x = document.createElement('button'); x.className = 'ib'; x.textContent = '×'; x.title = 'Remove';
      x.onclick = function () { editing.splice(i, 1); drawEditor(); };
      r.appendChild(x);
      ed.appendChild(r);
    });
    var eb = document.createElement('div'); eb.className = 'eb';
    var add = document.createElement('button'); add.className = 'btn'; add.textContent = '+ Add habit';
    add.disabled = editing.length >= 8;
    add.onclick = function () { editing.push({ orig: null, name: '' }); drawEditor(); var ins = ed.querySelectorAll('input'); };
    var sv = document.createElement('button'); sv.className = 'btn pri'; sv.textContent = 'Save';
    sv.onclick = saveEditor;
    var cn = document.createElement('button'); cn.className = 'btn'; cn.textContent = 'Cancel';
    cn.onclick = closeEditor;
    var hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = 'Up to 8 · history is kept when renaming';
    eb.appendChild(add); eb.appendChild(sv); eb.appendChild(cn); eb.appendChild(hint);
    ed.appendChild(eb); g.appendChild(ed);
    var last = ed.querySelectorAll('input'); if (last.length && !last[last.length - 1].value) last[last.length - 1].focus();
  }
  function saveEditor() {
    data = load(); data.habits = data.habits || {};
    var seen = {}, out = [];
    editing.forEach(function (row) {
      var n = (row.name || '').trim(); if (!n || seen[n]) return; seen[n] = 1;
      if (row.orig && row.orig !== n) { data.habits[n] = Object.assign({}, data.habits[n] || {}, data.habits[row.orig] || {}); }
      data.habits[n] = data.habits[n] || {};
      out.push(n);
    });
    if (!out.length) return;
    names = out; data.names = out; data.custom = true; save(data);
    closeEditor();
  }
  function closeEditor() {
    editing = null;
    document.querySelector('.tabs').style.visibility = '';
    document.getElementById('editBtn').style.display = '';
    render();
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'editBtn') { openEditor(); return; }
    if (editing) return;
    var tab = e.target.closest('.tab');
    if (tab) { view = tab.dataset.v; try { localStorage.setItem(KEY + '-view', view); } catch (x) {} render(); return; }
    var cell = e.target.closest('.cell[data-k]'); if (cell) { toggle(cell.dataset.h, cell.dataset.k); return; }
    var mark = e.target.closest('.mark'); if (mark) toggle(mark.dataset.h, iso(new Date()));
  });
  window.addEventListener('storage', function (e) { if (e.key === KEY) render(); });
  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
